name: CI

# Controlli veloci su ogni push/PR: build dell'esempio + SEO/GEO + strato dati + produzione senza editor.
on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm test
